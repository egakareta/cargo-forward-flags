[package]
name = "cargo-forward-flags"
version = "0.3.1"
edition = "2024"
description = "Generate Cargo feature forwarding declarations"
readme = "README.md"
repository = "https://github.com/egakareta/cargo-forward-flags"
license = "MIT OR Apache-2.0"
keywords = ["cargo", "cargo-subcommand", "dependencies", "features"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.8"
